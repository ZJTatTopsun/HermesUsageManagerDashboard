[project]
name = "hermes-usage-manager"
version = "0.5.1"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "tzdata>=2026.1"]

[project.optional-dependencies]
dev = ["uvicorn>=0.30,<1", "httpx>=0.27,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
